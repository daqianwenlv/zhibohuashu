<!DOCTYPE html>
<!-- 这是什么：AI 办公室「直播话术」平台——商品自动读来客、资料由项目方上传或填写、各场景话术由 AI 生成可手改；每条话术有编号，可转语音、播放、设为快捷键；角落里是录音设置 -->
<!-- 谁用：主播与直播运营；话术库 ./data/<项目>.lib.json，生成 /opt/ai-office/zhubo/gen_lib.py，资料解析 /opt/ai-office/zhubo/ingest.py，接口 ../api/zhubo/* -->
<!-- 什么时候改：话术库字段或操作方式变了；样式沿用工作台 ../app.css 的令牌，本页规则只写在下面 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>直播话术 · DQ WORKSPACE</title>
<link rel="stylesheet" href="../app.css?v=8-fix">
<style>
/* 布局：顶栏；三栏 场景 | 话术清单 | 快捷键与常见问题。话术是主角；录音设置藏在左下角 */
:root{--rail:220px;--aside:300px;--ring:rgba(31,122,68,.28)}
html,body{height:100%}
body{background:var(--surface);overflow:hidden}
button{font:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring);border-radius:8px}
.top{height:60px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line)}
.top .home{color:var(--t3);font-size:var(--fs-s);white-space:nowrap}
.top .home:hover{color:var(--ink)}
.top .sep{width:1px;height:18px;background:var(--line)}
.top h1{margin:0;font-size:var(--fs-l);font-weight:600;white-space:nowrap}
.pick{position:relative}
.pick>button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 8px;border-radius:8px;color:var(--ink);cursor:pointer;font-size:var(--fs);white-space:nowrap}
.pick>button:hover,.pick.open>button{background:var(--line-2)}
.pick>button svg{color:var(--t3)}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,24,28,.10);padding:6px;z-index:20;display:none}
.pick.open .menu{display:block}
.opt{display:grid;grid-template-columns:18px minmax(0,1fr);gap:2px 8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.opt:hover{background:var(--line-2)}
.opt .ck{color:var(--brand);visibility:hidden}
.opt.on .ck{visibility:visible}
.views{display:flex;gap:2px;margin-left:4px}
.views button{border:0;background:none;font-size:var(--fs);color:var(--t3);padding:6px 12px;border-radius:8px;cursor:pointer}
.views button:hover{color:var(--ink)}
.views button.on{color:var(--ink);background:var(--line-2);font-weight:500}
.top .end{margin-left:auto;display:flex;align-items:center;gap:10px}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:var(--fs-s);color:var(--t2);cursor:pointer;white-space:nowrap}
.sbtn:hover{color:var(--ink);border-color:#c8ced4}
.sbtn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.sbtn.p:hover{background:var(--brand-2)}
.sbtn:disabled{opacity:.5;cursor:default}
.state{font-size:var(--fs-s);color:var(--t2);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.bar{display:inline-block;width:80px;height:3px;background:var(--line-2);border-radius:2px;overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--brand)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.desk{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--aside);height:calc(100% - 61px)}
.col{overflow:auto;min-width:0}
.rail{border-right:1px solid var(--line);padding:14px 10px 0;display:flex;flex-direction:column}
.rail .list{flex:1}
.aside{border-left:1px solid var(--line);padding:22px 20px 40px;background:var(--surface-2)}
.stage{padding:30px 40px 80px}
/* 场景清单 */
.sc{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink);font-size:var(--fs-m)}
.sc:hover{background:var(--line-2)}
.sc.on{background:var(--brand-soft);font-weight:500}
.sc small{color:var(--t3);font-size:var(--fs-xs);font-weight:400;font-variant-numeric:tabular-nums}
.gear{display:flex;align-items:center;gap:6px;border:0;border-top:1px solid var(--line-2);background:none;color:var(--t3);font-size:var(--fs-xs);padding:12px 12px 14px;cursor:pointer;width:100%;text-align:left}
.gear:hover{color:var(--ink)}
.gear+.gear{border-top:0;padding-top:4px}
/* 编辑模式开关：平时话术只读，打开后才能改、删、加、调快捷键 */
.sw{width:26px;height:15px;border-radius:8px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .15s}
.gear.on{color:var(--brand)} .gear.on .sw{background:var(--brand)} .gear.on .sw::after{left:13px}
.modebar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;background:var(--brand-soft-2);color:var(--brand);font-size:var(--fs-s);max-width:900px}
.modebar .txt{margin-left:auto;color:var(--brand);font-weight:500}
.editing .it .say{cursor:text;border-radius:8px;margin-left:-6px;padding:0 6px}
.editing .it .say:hover{background:var(--line-2)}
/* 场景头 */
.sh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.sh h2{margin:0;font-size:var(--fs-xl)}
.sh .when{color:var(--t3);font-size:var(--fs-s)}
.sh .acts{margin-left:auto;display:flex;gap:8px}
.txt{border:0;background:none;font-size:var(--fs-s);color:var(--t2);cursor:pointer;padding:6px 6px}
.txt:hover{color:var(--ink)}
.txt.dg:hover{color:var(--red)}
/* 话术条 */
.items{display:grid;gap:12px;margin-top:20px;max-width:900px}
.it{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#fff;display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 14px}
.it.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.it .no{font-variant-numeric:tabular-nums;font-size:var(--fs-l);font-weight:600;color:var(--t3);line-height:1.6}
.it.on .no{color:var(--brand)}
.it .ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-s);color:var(--t2)}
.it .ttl b{color:var(--ink);font-weight:600;font-size:var(--fs)}
.chip2{font-size:var(--fs-xs);border-radius:5px;padding:1px 6px;background:var(--line-2);color:var(--t2)}
.chip2.g{background:var(--brand-soft);color:var(--brand)}
.chip2.a{background:var(--amber-soft);color:var(--amber)}
.it .say{grid-column:2;font-size:var(--fs-m);line-height:1.85;white-space:pre-wrap;margin-top:4px;cursor:default}
.it textarea{grid-column:2;width:100%;min-height:120px;font:inherit;font-size:var(--fs-m);line-height:1.8;border:1px solid var(--brand);border-radius:10px;padding:10px 12px;resize:vertical;margin-top:4px}
.it input.tt{font:inherit;font-size:var(--fs);border:1px solid var(--line);border-radius:8px;padding:4px 8px;width:220px}
.it .row{grid-column:2;display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.it .row .sp{margin-left:auto;display:flex;gap:2px}
.tts{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:18px;color:var(--ink);cursor:pointer;font-size:var(--fs-s)}
.tts:hover{border-color:#c8ced4}
.tts:disabled{color:var(--t3);cursor:wait}
.tts svg{color:var(--brand)}
.play{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:var(--brand);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.play:hover{background:var(--brand-2)}
.play:disabled{background:#fff;cursor:default;box-shadow:inset 0 0 0 1px var(--line)}
.play:disabled path{fill:var(--t4)}
.play svg.ring{position:absolute;inset:-4px;width:48px;height:48px;transform:rotate(-90deg);pointer-events:none}
.play svg.ring circle{fill:none;stroke-width:2}
.play .bg{stroke:transparent} .play .fg{stroke:var(--brand);transition:stroke-dashoffset .2s linear}
.hint{font-size:var(--fs-xs);color:var(--t3)}
/* 右侧 */
.aside h3{margin:0 0 10px;font-size:var(--fs-xs);font-weight:500;color:var(--t3);letter-spacing:.04em;display:flex;justify-content:space-between}
.aside section+section{margin-top:28px}
.keys{display:grid;gap:6px}
.key{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;width:100%}
.key:hover{border-color:#c8ced4}
.key.empty{border-style:dashed;cursor:default;color:var(--t4)}
.key .k{font-size:var(--fs-xs);border:1px solid var(--line);border-radius:5px;text-align:center;line-height:18px;color:var(--t2);font-variant-numeric:tabular-nums}
.key .n{font-size:var(--fs-s);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.key .n small{color:var(--t3);margin-right:4px}
.key .st{font-size:11px;color:var(--t3)}
.key.playing{border-color:var(--brand);background:var(--brand-soft-2)}
.key.ed{cursor:default;grid-template-columns:24px minmax(0,1fr) auto auto auto;gap:4px 8px}
.key .ib{border:0;background:none;width:24px;height:24px;border-radius:6px;color:var(--t3);cursor:pointer;display:grid;place-items:center;padding:0}
.key .ib:hover{background:var(--line-2);color:var(--ink)}
.key .ib.x:hover{color:var(--red)}
.key .ib:disabled{visibility:hidden}
.aside h3 .txt{padding:0;font-size:var(--fs-xs);color:var(--brand);letter-spacing:0}
.faq{display:grid;gap:2px}
.faq button{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:var(--fs-s);color:var(--ink)}
.faq button:hover{background:var(--line-2)}
.faq button small{color:var(--t3);font-variant-numeric:tabular-nums}
.faq button.off{color:var(--t3)}
/* 商品与资料 */
.page{max-width:900px}
.page h2{margin:0 0 6px;font-size:var(--fs-xl)}
.page .sub{color:var(--t3);font-size:var(--fs-s)}
.goods{display:grid;gap:10px;margin-top:18px}
.gd{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.gd b{font-weight:600}
.gd .m{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:var(--fs-s);color:var(--t2)}
.drop{margin-top:18px;border:1.5px dashed var(--line);border-radius:14px;padding:22px;display:grid;gap:12px;background:var(--surface-2)}
.drop.over{border-color:var(--brand);background:var(--brand-soft-2)}
.drop .big{font-size:var(--fs-m)}
.drop .row{display:flex;gap:8px;flex-wrap:wrap}
.drop input[type=url]{flex:1;min-width:220px;font:inherit;font-size:var(--fs-s);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.srcs{display:grid;gap:6px;margin-top:14px}
.srcs div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:var(--fs-s);border-bottom:1px solid var(--line-2);padding:8px 0}
.srcs span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcs small{color:var(--t3)}
.mtxt{width:100%;min-height:360px;font:inherit;font-size:var(--fs-s);line-height:1.8;border:1px solid var(--line);border-radius:12px;padding:14px;resize:vertical;margin-top:12px}
.sec2{margin-top:34px}
.sec2 h3{margin:0 0 10px;font-size:var(--fs-l)}
.need{counter-reset:n;list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:var(--fs-s);line-height:1.6}
.need li{counter-increment:n;display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px}
.need li::before{content:counter(n);color:var(--amber);font-variant-numeric:tabular-nums}
details.rv summary{cursor:pointer;font-size:var(--fs-l);font-weight:600}
.chg{display:grid;gap:3px;padding:10px 0;border-top:1px solid var(--line-2);font-size:var(--fs-s);line-height:1.7}
.chg .o{color:var(--t3);text-decoration:line-through}
.chg .w{color:var(--amber);font-size:var(--fs-xs)}
/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(20,24,28,.18);z-index:24}
.ask{position:fixed;left:50%;top:26%;transform:translateX(-50%);width:min(360px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(20,24,28,.16);padding:18px;z-index:25;display:grid;gap:8px}
.ask-h{font-size:var(--fs-l);font-weight:600;margin:2px 4px 6px}
.ask-o{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer}
.ask-o:hover{border-color:#c8ced4}
.ask-o.on{border-color:var(--brand);background:var(--brand-soft-2)}
.ask-o b{font-size:var(--fs-m)}
.ask-o small{color:var(--t3);font-size:var(--fs-xs)}
.ask .txt{justify-self:end}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(20,24,28,.10);z-index:25;display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.drawer .dh b{font-size:var(--fs-l)}
.drawer .db{overflow:auto;padding:18px 22px 30px;display:grid;gap:16px;align-content:start}
.drawer .df{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.host{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.host .hh{display:flex;align-items:center;gap:10px}
.host .hh b{font-size:var(--fs-m)}
.host .hh .txt{margin-left:auto}
.fl{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:center;font-size:var(--fs-s)}
.fl label{color:var(--t3)}
.fl input[type=text]{font:inherit;font-size:var(--fs-s);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
.fl .rg{display:flex;align-items:center;gap:10px}
.fl input[type=range]{flex:1;accent-color:var(--brand)}
.fl output{font-variant-numeric:tabular-nums;min-width:52px;text-align:right;color:var(--ink)}
.addhost{border:1.5px dashed var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;font-size:var(--fs-s)}
.addhost .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addhost select,.addhost input{font:inherit;font-size:var(--fs-s);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#hotbar{display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:var(--fs-s);z-index:40}
.empty{padding:60px 0;color:var(--t3)}
@media (max-width:1100px){:root{--aside:260px}.stage{padding:26px 26px 72px}}
@media (max-width:860px){
  body{overflow:auto}
  .top{height:auto;flex-wrap:wrap;padding:10px 12px;gap:6px}
  .top .home,.top .sep{display:none}
  .views{order:3;width:100%;margin:0}
  .desk{display:block;height:auto}
  .col{overflow:visible}
  .rail{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;padding:10px 12px;gap:6px}
  .rail .list{display:flex;gap:6px}
  .sc{flex:none;width:auto;border:1px solid var(--line);font-size:var(--fs)}
  .sc small{display:none}
  .gear{border:0;flex:none;padding:10px}
  .stage{padding:18px 14px 40px}
  .it{grid-template-columns:28px minmax(0,1fr);padding:14px}
  .aside{border-left:0;border-top:1px solid var(--line);padding:20px 14px 48px}
  .aside .keys-sec{display:none}
  body{padding-bottom:64px}
  #hotbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:6px;overflow-x:auto}
  #hotbar button{flex:none;min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:var(--fs-m);font-weight:600;color:var(--ink);display:grid;place-items:center;padding:0 10px}
  #hotbar button.off{color:var(--t4)}
  #hotbar button.playing{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
  .toast{bottom:76px}
}
@media (prefers-reduced-motion:reduce){.play .fg{transition:none}.dot{animation:none}}
</style>
</head>
<body>
<header class="top">
  <a class="home" href="../#/scene/huashu">工作台</a><span class="sep"></span>
  <h1>直播话术</h1>
  <div class="pick" id="pkProj"></div>
  <nav class="views" id="views" aria-label="视图"></nav>
  <div class="end" id="topEnd"></div>
</header>
<main class="desk">
  <nav class="col rail" id="rail" aria-label="场景"></nav>
  <section class="col stage" id="stage"><div class="empty">读取中</div></section>
  <aside class="col aside" id="aside"></aside>
</main>
<nav id="hotbar" aria-label="快捷键"></nav>
<div id="layer"></div>
<input type="file" id="fileMat" hidden multiple>
<input type="file" id="fileVoice" accept="audio/*" hidden>
<div id="toast"></div>
<audio id="au" preload="none"></audio>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHEV='<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
const WAVE='<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6v4M5 4v8M8 2v12M11 4v8M14 6v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const PLAY='<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5v11l9-5.5z" fill="#fff"/></svg>';
const PAUSE='<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="#fff"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="#fff"/></svg>';
const UP='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 7.5l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const DN='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const XX='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const VIEWS=[['scenes','场景'],['goods','商品'],['material','资料']];
const DEF_VOICE='9c685d238b8a';
const S={idx:null,pid:null,lib:null,err:'',view:'scenes',scene:'opening',sel:null,edit:null,hosts:[],voices:[],have:{},playing:null,busy:{},pre:null,gen:null,ask:null,set:null,open:null,mat:null,mode:false};
let toastT;
const toast=m=>{clearTimeout(toastT);$('#toast').innerHTML=`<div class="toast">${esc(m)}</div>`;toastT=setTimeout(()=>$('#toast').innerHTML='',2800);};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const norm=t=>String(t||'').replace(/\s+/g,' ').trim().slice(0,1500);
const api=(p,b)=>fetch('../api/zhubo/'+p,b?{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{credentials:'same-origin'}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('出错了 '+r.status));return j;});
const hostOf=id=>S.hosts.find(h=>h.id===id)||{};

// ---------- 话术库 ----------
const scenes=()=>(S.lib&&S.lib.scenes)||[];
const sceneOf=k=>scenes().find(s=>s.key===k)||scenes()[0];
function numMap(){const m={};let n=0;scenes().forEach(s=>s.items.forEach(it=>{m[it.id]=++n;}));return m;}
function itemById(id){for(const s of scenes())for(const it of s.items)if(it.id===id)return it;return null;}
const hotkeys=()=>(S.lib&&S.lib.hotkeys)||[];

// ---------- 顶栏 ----------
function renderTop(){
  const pj=(S.idx?S.idx.projects:[]),cur=pj.find(p=>p.id===S.pid);
  $('#pkProj').className='pick'+(S.open==='proj'?' open':'');
  $('#pkProj').innerHTML=`<button data-open="proj">${esc(cur?cur.name:'选项目')}${CHEV}</button><div class="menu">${pj.map(p=>`<button class="opt ${p.id===S.pid?'on':''}" data-proj="${esc(p.id)}"><span class="ck">✓</span><span>${esc(p.name)}</span></button>`).join('')}</div>`;
  $('#views').innerHTML=VIEWS.map(([k,t])=>`<button class="${S.view===k?'on':''}" data-view="${k}">${t}</button>`).join('');
  const g=S.gen,p=S.pre;let h='';
  if(g&&g.running)h+=`<span class="state"><span class="dot"></span>正在生成话术${g.scene&&g.scene!=='全部'?'（'+esc((sceneOf(g.scene)||{}).name||g.scene)+'）':''}</span>`;
  if(p&&p.running)h+=`<span class="state">${esc(hostOf(p.voice).name||'')}转语音 ${p.done} / ${p.total}<span class="bar"><i style="width:${p.total?Math.round(p.done/p.total*100):0}%"></i></span></span>`;
  if(!(p&&p.running))h+=`<button class="sbtn" data-act="askall">全部转语音</button>`;
  if(!(g&&g.running))h+=`<button class="sbtn" data-act="genall">重新生成全部话术</button>`;
  $('#topEnd').innerHTML=h;
}

// ---------- 左栏 ----------
function renderRail(){
  const list=S.view==='scenes'?scenes().map(s=>`<button class="sc ${s.key===S.scene?'on':''}" data-scene="${s.key}"><span>${esc(s.name)}</span><small>${s.items.length}</small></button>`).join('')
    :S.view==='material'?['上传资料','景区资料','要找园方核实','原稿改了哪些'].map(x=>`<button class="sc" data-jump="${x}"><span>${x}</span></button>`).join(''):'';
  const mode=S.view==='scenes'?`<button class="gear ${S.mode?'on':''}" data-act="mode" aria-pressed="${S.mode}"><span class="sw"></span>编辑模式</button>`:'';
  $('#rail').innerHTML=`<div class="list">${list}</div>${mode}<button class="gear" data-act="settings"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>录音设置</button>`;
}

// ---------- 话术条 ----------
const C=2*Math.PI*22;
function itemHTML(it,no){
  const k=norm(it.text),a=S.have[k],busy=!!S.busy[k],on=S.playing===k&&!au.paused,hk=hotkeys().indexOf(it.id);
  const editing=S.edit===it.id;
  return `<div class="it ${S.sel===it.id?'on':''}" data-item="${esc(it.id)}"><div class="no">${no}</div>
    <div class="ttl">${editing?`<input class="tt" id="edTitle" value="${esc(it.title)}" maxlength="24" aria-label="标题">`:`<b>${esc(it.title)}</b>`}
      ${it.edited?'<span class="chip2">改过</span>':''}${hk>=0?`<span class="chip2 g">快捷键 ${hk+1}</span>`:''}${!a&&!busy&&!editing?'<span class="chip2 a">还没转语音</span>':''}</div>
    ${editing?`<textarea id="edText" aria-label="话术">${esc(it.text)}</textarea>`:`<div class="say" ${S.mode?'data-act="edit" title="点一下修改"':'title="双击修改"'}>${esc(it.text)}</div>`}
    <div class="row">${editing?`<button class="sbtn p" data-act="save">保存</button><button class="txt" data-act="cancel">取消</button><span class="hint">保存后要重新转语音</span>`
      :`<button class="tts" data-act="ask" ${busy?'disabled':''}>${WAVE}${busy?'正在转…':'转成语音'}</button>
      <button class="play" data-act="play" aria-label="${on?'暂停':'播放'}" ${a&&!busy?'':'disabled'}><svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle class="bg" cx="24" cy="24" r="22"/><circle class="fg" ${on?'id="ringfg"':''} cx="24" cy="24" r="22" stroke-dasharray="${C}" stroke-dashoffset="${on&&au.duration?C*(1-au.currentTime/au.duration):C}"/></svg>${on?PAUSE:PLAY}</button>
      ${a?`<span class="hint">${a.rec?'你的录音':esc(hostOf(a.voice).name||'')}${!a.rec&&hostOf(a.voice).speed&&hostOf(a.voice).speed!==1?' · '+hostOf(a.voice).speed+' 倍':''}</span>`:''}
      <span class="sp">${S.mode?'<button class="txt" data-act="edit">修改</button>':''}<button class="txt" data-act="pin">${hk>=0?'取消快捷键':'设为快捷键'}</button>${S.mode?'<button class="txt dg" data-act="del">删除</button>':''}</span>`}</div></div>`;
}
function renderScenes(){
  const sc=sceneOf(S.scene);if(!sc)return '<div class="empty">这个项目还没有话术，点右上角「重新生成全部话术」</div>';
  const nm=numMap(),g=S.gen;
  return `<div class="sh"><h2>${esc(sc.name)}</h2><span class="when">${esc(sc.when||'')}</span>${S.mode?`<span class="acts"><button class="txt" data-act="add">加一条</button><button class="txt" data-act="genscene" ${g&&g.running?'disabled':''}>重新生成这个场景</button></span>`:''}</div>
    ${S.mode?'<div class="modebar" style="margin:16px 0 0">编辑模式：点话术直接改，也可以删除、加一条；右边快捷键可以调顺序、移除<button class="txt" data-act="mode">完成</button></div>':''}
    ${S.adding?`<div class="it on" style="margin-top:20px"><div class="no">+</div><div class="ttl"><input class="tt" id="addTitle" placeholder="这条讲什么（可不填）" maxlength="24"></div><textarea id="addText" placeholder="写主播要说的话"></textarea><div class="row"><button class="sbtn p" data-act="addsave">保存</button><button class="txt" data-act="addcancel">取消</button></div></div>`:''}
    <div class="items ${S.mode?'editing':''}">${sc.items.map(it=>itemHTML(it,nm[it.id])).join('')||'<div class="empty">这个场景还没有话术</div>'}</div>`;
}
function renderAside(){
  const nm=numMap(),hk=hotkeys();
  const keys=Array.from({length:9},(_,i)=>{const id=hk[i],it=id&&itemById(id);if(!it)return `<div class="key empty"><span class="k">${i+1}</span><span class="n">空</span><span></span></div>`;
    const k=norm(it.text),a=S.have[k],on=S.playing===k&&!au.paused;
    if(S.mode)return `<div class="key ed"><span class="k">${i+1}</span><span class="n"><small>${nm[id]}</small>${esc(it.title)}</span><button class="ib" data-act="hkup" data-i="${i}" aria-label="上移" title="上移" ${i===0?'disabled':''}>${UP}</button><button class="ib" data-act="hkdn" data-i="${i}" aria-label="下移" title="下移" ${i>=hk.length-1?'disabled':''}>${DN}</button><button class="ib x" data-act="hkrm" data-i="${i}" aria-label="移除" title="移除">${XX}</button></div>`;
    return `<button class="key ${on?'playing':''}" data-hot="${i}"><span class="k">${i+1}</span><span class="n"><small>${nm[id]}</small>${esc(it.title)}</span><span class="st">${on?'播放中':a?'':'未转'}</span></button>`;}).join('');
  // 常见问题就是「答疑」场景；右边留一份速查，人在答疑场景时不重复列
  const qa=(sceneOf('qa')||{items:[]}).items,inQa=S.view==='scenes'&&S.scene==='qa';
  return `<section class="keys-sec"><h3><span>快捷键${S.mode?'':' · 按数字键直接播'}</span><button class="txt" data-act="mode">${S.mode?'完成':'编辑'}</button></h3><div class="keys">${keys}</div>${S.mode?'<div class="hint" style="margin-top:8px">加新的：在话术上点「设为快捷键」</div>':''}</section>
    ${inQa||!qa.length?'':`<section><h3><span>常见问题 · ${qa.length} 条</span><button class="txt" data-scene="qa">去答疑场景</button></h3><div class="faq">${qa.map(it=>{const a=S.have[norm(it.text)];return `<button class="${a?'':'off'}" data-quick="${esc(it.id)}"><small>${nm[it.id]}</small><span>${esc(it.title)}</span></button>`;}).join('')}</div></section>`}`;
}
function renderGoods(){
  const g=(S.lib&&S.lib.goods)||{},m=(S.lib&&S.lib.meta)||{};const ids=Object.keys(g);
  return `<div class="page"><h2>在售商品</h2><div class="sub">自动读来客后台，共 ${ids.length} 件${m.goods_read_at?'，'+esc(String(m.goods_read_at).slice(5,16))+' 读取':''}。话术里的价格、包含和须知都以这里为准。</div>
    <div class="goods">${ids.map(id=>{const x=g[id];return `<div class="gd"><b>${esc(x.name)}</b><div class="m"><span>${esc(x.price_yuan||'')}</span><span>${esc(x.use_window||'')}</span>${x.crowd?`<span>${esc(x.crowd)}</span>`:''}<span>${esc(x.refund||'')}</span>${x.stock?`<span>${esc(x.stock)}</span>`:''}</div></div>`;}).join('')}</div></div>`;
}
function renderMaterial(){
  const M=S.mat,L=S.lib||{};
  if(!M)return '<div class="empty">读取中</div>';
  return `<div class="page">
    <div id="m-上传资料"><h2>景区资料</h2><div class="sub">AI 写话术时以这里为准：园区、项目、演艺、周边、开放时间、注意事项。可以直接改，也可以上传。</div>
    <div class="drop" id="drop"><div class="big">把文件拖到这里，或者<button class="txt" data-act="pickfile" style="color:var(--brand)">选文件</button></div>
      <div class="hint">Word、PDF、Excel、PPT、图片、文本都可以；读出来的文字追加到下面的资料里</div>
      <div class="row"><input type="url" id="matLink" placeholder="或者贴链接：飞书文档、飞书表格、网页"><button class="sbtn" data-act="readlink">读取</button></div>
      ${S.matBusy?`<div class="state"><span class="dot"></span>${esc(S.matBusy)}</div>`:''}</div>
    ${M.sources&&M.sources.length?`<div class="srcs">${M.sources.slice().reverse().map(x=>`<div><span>${esc(x.name)}</span><small>${esc(x.kind)} · ${x.chars} 字 · ${esc(x.at)}</small></div>`).join('')}</div>`:''}</div>
    <div class="sec2" id="m-景区资料"><h3 style="display:flex;align-items:center;gap:10px">资料全文<button class="sbtn p" data-act="savemat" style="margin-left:auto">保存资料</button></h3>
      <textarea class="mtxt" id="matText" aria-label="景区资料">${esc(M.text||'')}</textarea><div class="hint">资料改了以后，点右上角「重新生成全部话术」，或者到某个场景里「重新生成这个场景」。</div></div>
    ${(L.verify||[]).length?`<div class="sec2" id="m-要找园方核实"><h3>要找园方核实</h3><ul class="need">${L.verify.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ul></div>`:''}
    ${(L.doc_review||[]).length?`<div class="sec2" id="m-原稿改了哪些"><details class="rv"><summary>原稿改了哪些</summary>${L.doc_review.map(m=>`<div style="margin-top:14px"><b>${esc(m.module)}</b>${(m.changes||[]).map(c=>`<div class="chg"><div class="o">${esc(c.orig)}</div><div>${esc(c.new)}</div><div class="w">${esc(c.why)}</div></div>`).join('')}</div>`).join('')}</details></div>`:''}
  </div>`;
}
function layer(){
  if(S.ask){const hs=S.hosts;const def=lsGet('zbVoice')||DEF_VOICE;
    return `<div class="mask" data-act="close"></div><div class="ask" role="dialog"><div class="ask-h">${S.ask.all?'整套话术用谁的声音？':'这一条用谁的声音？'}</div>
      ${hs.map(h=>`<button class="ask-o ${h.id===def?'on':''}" data-host="${esc(h.id)}"><b>${esc(h.name)}</b><small>${esc(h.who||'')}</small></button>`).join('')}<button class="txt" data-act="close">取消</button></div>`;}
  if(S.set){const T=S.set;
    return `<div class="mask" data-act="close"></div><div class="drawer" role="dialog"><div class="dh"><b>录音设置</b><button class="txt" data-act="close">关闭</button></div><div class="db">
      ${T.hosts.map((h,i)=>`<div class="host"><div class="hh"><b>${esc(h.name)}</b><button class="txt dg" data-act="rmhost" data-i="${i}">移出名单</button></div>
        <div class="fl"><label>是谁</label><input type="text" data-f="who" data-i="${i}" value="${esc(h.who||'')}" placeholder="如：年轻的景区主播，有活力"></div>
        <div class="fl"><label>在哪说</label><input type="text" data-f="where" data-i="${i}" value="${esc(h.where||'')}" placeholder="如：直播间卖门票"></div>
        <div class="fl"><label>情绪</label><input type="text" data-f="mood" data-i="${i}" value="${esc(h.mood||'')}" placeholder="如：热情、语速快"></div>
        <div class="fl"><label>说话快慢</label><span class="rg"><input type="range" min="-20" max="80" step="5" data-f="rate" data-i="${i}" value="${h.rate}"><output>${rateLabel(h.rate)}</output></span></div>
        <div class="fl"><label>播放倍速</label><span class="rg"><input type="range" min="0.8" max="2" step="0.1" data-f="speed" data-i="${i}" value="${h.speed}"><output>${Number(h.speed).toFixed(1)} 倍</output></span></div></div>`).join('')}
      <div class="addhost"><b>加一位主播</b>
        ${T.voices.length?`<div class="row"><select id="addVoice">${T.voices.map(v=>`<option value="${esc(v.id)}">${esc(v.name)}${v.who?' · '+esc(v.who):''}</option>`).join('')}</select><button class="sbtn" data-act="addvoice">加入</button></div>`:''}
        <div class="row"><input type="text" id="newName" placeholder="新主播名字" maxlength="20" style="width:140px"><button class="sbtn" data-act="recvoice">上传一段录音</button><span class="hint">10 到 30 秒，说话清楚</span></div></div>
      <div class="hint">「说话快慢」改了以后，这位主播的话要重新转语音；「播放倍速」马上生效。</div></div>
      <div class="df"><button class="txt" data-act="close">取消</button><button class="sbtn p" data-act="saveset">保存</button></div></div>`;}
  return '';
}
const rateLabel=r=>r<=0?'慢':r<=15?'正常':r<=40?'快':'很快';
function render(){
  renderTop();renderRail();
  if(!S.lib){$('#stage').innerHTML=`<div class="empty">${esc(S.err||'读取中')}</div>`;$('#aside').innerHTML='';$('#layer').innerHTML=layer();return;}
  $('#stage').innerHTML=S.view==='scenes'?renderScenes():S.view==='goods'?renderGoods():renderMaterial();
  $('#aside').innerHTML=renderAside();$('#layer').innerHTML=layer();
  const hk=hotkeys();$('#hotbar').innerHTML=hk.map((id,i)=>{const x=itemById(id);if(!x)return '';const k=norm(x.text),on=S.playing===k&&!au.paused;return `<button class="${S.have[k]?'':'off'} ${on?'playing':''}" data-hot="${i}" title="${esc(x.title)}">${i+1}</button>`;}).join('');
  if(S.edit){const t=$('#edText');if(t&&document.activeElement!==t&&!$('#edTitle').matches(':focus')){t.focus();t.setSelectionRange(t.value.length,t.value.length);}}
}

// ---------- 播放与转语音 ----------
const au=$('#au');au.preservesPitch=true;
function stopAudio(){if(!au.paused)au.pause();S.playing=null;}
function playItem(it){
  const k=norm(it.text),a=S.have[k];
  if(!a){toast('这一条还没转语音');return;}
  if(S.playing===k&&!au.paused){au.pause();render();return;}
  if(S.playing===k&&au.paused&&au.currentTime>0&&au.currentTime<au.duration){au.play();render();return;}
  au.src=a.url;au.playbackRate=a.rec?1:(hostOf(a.voice).speed||1);S.playing=k;
  au.play().catch(()=>{S.playing=null;toast('浏览器没让播放，再点一次');render();});render();
}
async function tts(it,voice){
  const k=norm(it.text);lsSet('zbVoice',voice);S.ask=null;stopAudio();S.busy[k]=true;render();
  try{const j=await api('tts',{text:k,voice});S.have[k]={url:'./'+j.url,rec:false,voice};toast((hostOf(voice).name||'')+'的语音好了');}
  catch(e){toast(e.message);}
  delete S.busy[k];render();
}
au.addEventListener('timeupdate',()=>{const fg=document.getElementById('ringfg');if(fg&&au.duration)fg.style.strokeDashoffset=C*(1-au.currentTime/au.duration);});
au.addEventListener('ended',()=>{S.playing=null;render();});
au.addEventListener('ratechange',()=>{});
function allTexts(){const t=[];scenes().forEach(s=>s.items.forEach(it=>t.push(norm(it.text))));return [...new Set(t.filter(x=>x.length>=2))];}
async function refreshHave(){
  if(!S.lib||!S.hosts.length)return;const texts=allTexts();const pref=lsGet('zbVoice')||DEF_VOICE;
  const order=S.hosts.map(h=>h.id).sort((a,b)=>a===pref?1:b===pref?-1:0);const m={};
  for(const vid of order){try{const j=await api('have',{voice:vid,texts});(j.have||[]).forEach((x,i)=>{if(x)m[texts[i]]={url:'./'+x.url,rec:x.rec,voice:vid};});}catch(e){}}
  S.have=m;
  if(S.pre&&S.pre.running){try{const st=await api('pregen?project='+encodeURIComponent(S.pid)+'&voice='+encodeURIComponent(S.pre.voice));S.pre=Object.assign({voice:S.pre.voice},st);}catch(e){}}
  if(!S.playing&&!S.edit)render();
  clearTimeout(refreshHave.t);if(S.pre&&S.pre.running)refreshHave.t=setTimeout(refreshHave,15000);
}
async function pregen(voice){
  S.ask=null;lsSet('zbVoice',voice);
  try{const j=await api('pregen',{project:S.pid,voice});S.pre=Object.assign({voice},j);toast((hostOf(voice).name||'')+'开始转整套话术');}catch(e){toast(e.message);return;}
  render();clearTimeout(refreshHave.t);refreshHave.t=setTimeout(refreshHave,15000);
}

// ---------- 生成 ----------
async function gen(scene){
  if(!confirm2(scene))return;
  try{S.gen=await api('gen',{project:S.pid,scene:scene||''});toast('开始生成，大约 5 到 15 分钟，改过的话术不会被覆盖');render();pollGen();}catch(e){toast(e.message);}
}
const confirm2=()=>true;
async function pollGen(){
  clearTimeout(pollGen.t);
  try{const st=await api('gen?project='+encodeURIComponent(S.pid));const was=S.gen&&S.gen.running;S.gen=st;
    if(was&&!st.running){if(st.error)toast('生成没成功：'+st.error);else{toast('话术已更新');await loadLib();}}
  }catch(e){}
  renderTop();if(S.gen&&S.gen.running)pollGen.t=setTimeout(pollGen,15000);
}

// ---------- 读写 ----------
async function loadLib(){
  try{const r=await fetch('./data/'+encodeURIComponent(S.pid)+'.lib.json?t='+Date.now(),{credentials:'same-origin'});if(!r.ok)throw 0;S.lib=await r.json();S.err='';}
  catch(e){S.lib=null;S.err='这个项目还没有话术库';}
  if(S.lib&&!sceneOf(S.scene))S.scene=scenes()[0].key;render();refreshHave();
}
async function loadHosts(){try{const j=await api('hosts');S.hosts=j.hosts||[];S.voices=j.voices||[];}catch(e){}render();refreshHave();}
async function loadMat(){try{S.mat=await api('material?project='+encodeURIComponent(S.pid));}catch(e){S.mat={text:'',sources:[]};}if(S.view==='material')render();}
function pick(pid){S.pid=pid;S.lib=null;S.have={};S.pre=null;S.mat=null;S.sel=null;S.edit=null;stopAudio();lsSet('zbProject',pid);render();loadLib();loadMat();pollGen();}
function load(){
  fetch('./data/index.json?t='+Date.now(),{credentials:'same-origin'}).then(r=>r.ok?r.json():null).then(ix=>{
    S.idx=ix&&ix.projects&&ix.projects.length?ix:{projects:[{id:'yaoxue-ice-world',name:'耀雪冰雪世界'}]};
    const want=(location.hash.match(/p=([\w-]+)/)||[])[1]||lsGet('zbProject');
    pick(S.idx.projects.some(p=>p.id===want)?want:S.idx.projects[0].id);
  }).catch(()=>{S.err='项目清单没读到';render();});
  loadHosts();
}
function setHot(list){S.lib.hotkeys=list;render();api('hotkeys',{project:S.pid,keys:list}).catch(e=>toast(e.message));}
async function uploadMat(files){
  for(const f of files){S.matBusy='正在读 '+f.name;render();
    try{const r=await fetch('../api/zhubo/material-file?project='+encodeURIComponent(S.pid)+'&name='+encodeURIComponent(f.name),{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/octet-stream'},body:f});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'没读出来');toast(f.name+'：读到 '+j.chars+' 字');}
    catch(e){toast(f.name+'：'+e.message);}}
  S.matBusy='';await loadMat();render();
}

// ---------- 点击 ----------
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-open],[data-proj],[data-view],[data-scene],[data-act],[data-host],[data-hot],[data-quick],[data-jump]');
  if(!t){if(S.open){S.open=null;renderTop();}const ie=e.target.closest('[data-item]');if(ie&&!S.edit&&S.sel!==ie.dataset.item&&!String(window.getSelection())){S.sel=ie.dataset.item;render();}return;}
  const itEl=e.target.closest('[data-item]'),it=itEl?itemById(itEl.dataset.item):null;
  if(t.dataset.open){S.open=S.open===t.dataset.open?null:t.dataset.open;renderTop();return;}
  if(t.dataset.proj){S.open=null;history.replaceState(null,'','#p='+t.dataset.proj);pick(t.dataset.proj);return;}
  if(t.dataset.view){S.view=t.dataset.view;S.edit=null;stopAudio();render();$('#stage').scrollTop=0;if(S.view==='material'&&!S.mat)loadMat();return;}
  if(t.dataset.scene){S.view='scenes';S.scene=t.dataset.scene;S.sel=null;S.edit=null;S.adding=false;stopAudio();render();$('#stage').scrollTop=0;return;}
  if(t.dataset.jump){const el=document.getElementById('m-'+t.dataset.jump);if(el)el.scrollIntoView({block:'start',behavior:'smooth'});return;}
  if(t.dataset.hot!=null){const id=hotkeys()[+t.dataset.hot],x=id&&itemById(id);if(x)playItem(x);return;}
  if(t.dataset.quick){const x=itemById(t.dataset.quick);if(x){S.sel=x.id;playItem(x);}return;}
  if(t.dataset.host){const v=t.dataset.host;if(S.ask.all)pregen(v);else{const x=itemById(S.ask.id);if(x)tts(x,v);}return;}
  const a=t.dataset.act;
  if(it)S.sel=it.id;
  switch(a){
    case 'close':S.ask=null;S.set=null;render();break;
    case 'mode':S.mode=!S.mode;if(!S.mode){S.edit=null;S.adding=false;}render();break;
    case 'hkrm':{const h=hotkeys().slice();h.splice(+t.dataset.i,1);setHot(h);break;}
    case 'hkup':case 'hkdn':{const h=hotkeys().slice(),i=+t.dataset.i,j=a==='hkup'?i-1:i+1;if(j<0||j>=h.length)break;[h[i],h[j]]=[h[j],h[i]];setHot(h);break;}
    case 'ask':S.ask={id:it.id};render();break;
    case 'askall':S.ask={all:true};render();break;
    case 'play':playItem(it);break;
    case 'edit':S.edit=it.id;render();break;
    case 'cancel':S.edit=null;render();break;
    case 'save':{const text=$('#edText').value,title=$('#edTitle').value;try{const n=await api('item',{project:S.pid,id:it.id,text,title});Object.assign(it,n);S.edit=null;toast('已保存，记得重新转语音');}catch(err){toast(err.message);}render();break;}
    case 'pin':{const h=hotkeys().slice(),i=h.indexOf(it.id);if(i>=0)h.splice(i,1);else{if(h.length>=9){toast('快捷键 9 个已满，先取消一个');break;}h.push(it.id);}setHot(h);break;}
    case 'del':{if(S.delArm!==it.id){S.delArm=it.id;toast('再点一次「删除」确认');break;}S.delArm=null;try{await api('item-del',{project:S.pid,id:it.id});await loadLib();toast('已删除');}catch(err){toast(err.message);}break;}
    case 'add':S.adding=true;render();setTimeout(()=>{const x=$('#addText');if(x)x.focus();},0);break;
    case 'addcancel':S.adding=false;render();break;
    case 'addsave':{try{await api('item-add',{project:S.pid,scene:S.scene,title:$('#addTitle').value,text:$('#addText').value});S.adding=false;await loadLib();toast('已加上');}catch(err){toast(err.message);}break;}
    case 'genall':gen('');break;
    case 'genscene':gen(S.scene);break;
    case 'pickfile':$('#fileMat').click();break;
    case 'readlink':{const u=$('#matLink').value.trim();if(!u){toast('先贴链接');break;}S.matBusy='正在读链接';render();try{const j=await api('material-link',{project:S.pid,url:u});toast('读到 '+j.chars+' 字');}catch(err){toast(err.message);}S.matBusy='';await loadMat();render();break;}
    case 'savemat':{try{await api('material',{project:S.pid,text:$('#matText').value});toast('资料已保存');await loadMat();}catch(err){toast(err.message);}break;}
    case 'settings':{try{const j=await api('hosts');S.set={hosts:j.hosts.map(h=>({...h})),voices:j.voices||[]};}catch(err){toast(err.message);break;}render();break;}
    case 'rmhost':S.set.hosts.splice(+t.dataset.i,1);render();break;
    case 'addvoice':{const v=$('#addVoice').value,x=S.set.voices.find(y=>y.id===v);if(x){S.set.hosts.push({id:x.id,name:x.name,who:x.who,where:'',mood:'',rate:15,speed:1});S.set.voices=S.set.voices.filter(y=>y.id!==v);render();}break;}
    case 'recvoice':{if(!$('#newName').value.trim()){toast('先写新主播的名字');break;}S.newName=$('#newName').value.trim();$('#fileVoice').click();break;}
    case 'saveset':{const T=S.set;try{
        for(const h of T.hosts){const old=S.hosts.find(x=>x.id===h.id)||{};if((old.who||'')!==(h.who||'')||(old.where||'')!==(h.where||'')||(old.mood||'')!==(h.mood||''))await api('host-scene',{id:h.id,who:h.who,where:h.where,mood:h.mood});}
        const j=await api('hosts',{hosts:T.hosts.map(h=>({id:h.id,rate:+h.rate,speed:+h.speed}))});S.hosts=j.hosts;S.set=null;toast('录音设置已保存');refreshHave();}catch(err){toast(err.message);}render();break;}
  }
});
document.addEventListener('input',e=>{const el=e.target;if(!S.set||el.dataset.i==null)return;const h=S.set.hosts[+el.dataset.i];h[el.dataset.f]=el.type==='range'?+el.value:el.value;
  if(el.type==='range'){const o=el.parentNode.querySelector('output');if(o)o.textContent=el.dataset.f==='rate'?rateLabel(+el.value):Number(el.value).toFixed(1)+' 倍';}});
// 平时模式：双击话术也能改这一条
document.addEventListener('dblclick',e=>{const sy=e.target.closest('.say');if(!sy||S.mode)return;const ie=sy.closest('[data-item]');if(!ie)return;window.getSelection().removeAllRanges();S.sel=S.edit=ie.dataset.item;render();});
$('#fileMat').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';if(f.length)uploadMat(f);});
$('#fileVoice').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;toast('正在把录音交给声音工作台');
  try{const r=await fetch('../api/zhubo/host-upload?name='+encodeURIComponent(S.newName||''),{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/octet-stream'},body:f});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'没收下');
    S.hosts=j.hosts;S.set={hosts:j.hosts.map(h=>({...h})),voices:j.voices||[]};toast('新主播已加入');render();}catch(err){toast(err.message);}});
// 资料拖拽
document.addEventListener('dragover',e=>{if(S.view==='material'&&e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();const d=$('#drop');if(d)d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=$('#drop');if(d&&!e.relatedTarget)d.classList.remove('over');});
document.addEventListener('drop',e=>{if(S.view!=='material')return;e.preventDefault();const d=$('#drop');if(d)d.classList.remove('over');const f=[...(e.dataTransfer.files||[])];if(f.length)uploadMat(f);});
// 键盘：1–9 快捷键直接播；↑↓ 选话术；空格播放选中的
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.ask||S.set||S.open||S.edit){S.ask=null;S.set=null;S.open=null;S.edit=null;render();}else if(S.mode){S.mode=false;S.adding=false;render();}return;}
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||S.set||S.ask)return;
  if(/^[1-9]$/.test(e.key)){const id=hotkeys()[+e.key-1],x=id&&itemById(id);if(x){e.preventDefault();playItem(x);}return;}
  if(S.view!=='scenes')return;const its=(sceneOf(S.scene)||{items:[]}).items;let i=its.findIndex(x=>x.id===S.sel);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();i=e.key==='ArrowDown'?Math.min(its.length-1,i+1):Math.max(0,i-1);S.sel=its[i]&&its[i].id;stopAudio();render();const el=document.querySelector('.it.on');if(el)el.scrollIntoView({block:'nearest'});}
  else if(e.key===' '&&S.sel&&e.target.tagName!=='BUTTON'){e.preventDefault();const x=itemById(S.sel);if(x)playItem(x);}
});
load();
})();
</script>
</body>
</html>
